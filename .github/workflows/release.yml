name: release

# Manual npm publish. Run it by hand from the Actions tab ("Run workflow") —
# there is no tag-driven trigger, so a push or tag never publishes on its own.
# It typechecks, tests, builds, and publishes `meshy-cli` plus its scoped alias
# `@meshy-ai/cli` at whatever version package.json currently declares.
#
# One-time setup: an npm automation token with publish rights on `meshy-cli`
# and the `@meshy-ai` scope, stored as the `NPM_TOKEN` secret.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Keep release compatible with the enterprise Actions allow-list while
      # still using the pnpm version pinned in package.json.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

      - name: Built dist reports the package.json version
        run: |
          test "$(node dist/index.js --version)" = "$(node -p "require('./package.json').version")"

      # Both publish steps skip versions that already exist on the registry,
      # so re-running the workflow after a half-published release (e.g. the
      # unscoped package went out but the alias failed on scope/token setup)
      # resumes at the missing package instead of erroring on the first.
      - name: Publish meshy-cli
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "meshy-cli@$v" version >/dev/null 2>&1; then
            echo "meshy-cli@$v already published — skipping"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish scoped alias @meshy-ai/cli (same version)
        run: |
          npm pkg set name="@meshy-ai/cli"
          v="$(node -p "require('./package.json').version")"
          if npm view "@meshy-ai/cli@$v" version >/dev/null 2>&1; then
            echo "@meshy-ai/cli@$v already published — skipping"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
